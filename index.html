<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>竹隱墨寶：百鬼夜行錄 - 功夫熊貓浪人傳</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&display=swap');
  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
  body, html {
    width: 100%; height: 100%; overflow: hidden;
    background-color: #EDE8DF; font-family: 'Noto Serif TC', serif;
  }
  #game-container {
    position: relative; width: 100vw; height: 100vh; overflow: hidden;
    background: radial-gradient(circle at center, #FAF7F2 0%, #EDE5D8 100%);
  }
  canvas { display: block; width: 100%; height: 100%; }

  /* 頂部 HUD 資訊 */
  #top-hud {
    position: absolute; top: 12px; left: 0; width: 100%;
    display: flex; flex-direction: column; align-items: center;
    pointer-events: none; z-index: 10;
  }
  .exp-bar-wrap {
    width: 86%; max-width: 640px; height: 12px;
    background: rgba(43,42,41,0.12); border: 2px solid #2B2A29;
    border-radius: 8px; overflow: hidden; box-shadow: 0 3px 8px rgba(0,0,0,0.1);
  }
  .exp-bar-fill {
    width: 0%; height: 100%;
    background: linear-gradient(90deg, #00C2FF, #00F2FF);
    transition: width 0.15s ease-out;
  }
  .hud-stats {
    display: flex; gap: 24px; margin-top: 8px; font-weight: 900;
    font-size: 14px; color: #2B2A29; text-shadow: 0 1px 2px rgba(255,255,255,0.8);
  }
  .hud-stats span { display: inline-flex; align-items: center; gap: 4px; }

  /* 左下角血量與奧義槽 */
  #player-hud {
    position: absolute; bottom: 20px; left: 20px;
    display: flex; flex-direction: column; gap: 6px;
    pointer-events: none; z-index: 10;
  }
  .gauge-box {
    display: flex; align-items: center; gap: 8px;
    background: rgba(250,247,242,0.9); padding: 4px 10px;
    border: 1.5px solid #2B2A29; border-radius: 6px;
    box-shadow: 2px 2px 0 rgba(43,42,41,0.3); font-size: 13px; font-weight: 900;
  }
  .bar-bg { width: 150px; height: 10px; background: rgba(0,0,0,0.15); border-radius: 5px; overflow: hidden; }
  .hp-fill { width: 100%; height: 100%; background: #FF2A4D; transition: width 0.1s; }
  .ult-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #FFB300, #FF1744); }

  /* 觸控虛擬控制 */
  #touch-controls {
    position: absolute; width: 100%; height: 100%;
    top: 0; left: 0; pointer-events: none; z-index: 20; display: none;
  }
  #joystick-zone {
    position: absolute; bottom: 30px; left: 30px; width: 130px; height: 130px;
    pointer-events: auto;
  }
  .joy-base {
    position: absolute; width: 100%; height: 100%; border-radius: 50%;
    background: rgba(43,42,41,0.06); border: 2px dashed rgba(43,42,41,0.4);
  }
  .joy-stick {
    position: absolute; width: 50px; height: 50px; border-radius: 50%;
    top: 40px; left: 40px; background: #2B2A29; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  }
  .action-buttons {
    position: absolute; bottom: 35px; right: 25px;
    display: flex; gap: 14px; pointer-events: auto;
  }
  .act-btn {
    width: 62px; height: 62px; border-radius: 50%; border: 2px solid #2B2A29;
    background: #FAF7F2; color: #2B2A29; font-weight: 900; font-size: 14px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    box-shadow: 2px 4px 0 #2B2A29; cursor: pointer; transition: transform 0.08s;
  }
  .act-btn:active { transform: translate(2px, 4px); box-shadow: none; }
  .act-btn span { font-size: 10px; color: #888; }
  .btn-parry { border-color: #00A86B; color: #00A86B; }
  .btn-ult { border-color: #C93B2B; color: #C93B2B; }

  /* 彈窗遮罩共通 */
  .modal-overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(30, 28, 26, 0.72); backdrop-filter: blur(4px);
    display: none; justify-content: center; align-items: center;
    z-index: 100;
  }
  .washi-board {
    background: #FAF7F2; border: 3px solid #2B2A29; border-radius: 12px;
    padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.4), inset 0 0 40px rgba(215,204,185,0.4);
    position: relative; max-width: 90vw;
  }
  .board-title {
    text-align: center; font-size: 26px; font-weight: 900; color: #2B2A29;
    margin-bottom: 20px; letter-spacing: 2px;
  }
  .board-title::after {
    content: ''; display: block; width: 60px; height: 3px; background: #C93B2B;
    margin: 6px auto 0;
  }

  /* 升級繪馬三選一 */
  .cards-row { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
  .upgrade-card {
    width: 220px; background: #FFFDF9; border: 2px solid #2B2A29; border-radius: 8px;
    padding: 12px; cursor: pointer; display: flex; flex-direction: column; align-items: center;
    box-shadow: 3px 5px 0 rgba(43,42,41,0.25); transition: all 0.15s ease; position: relative;
  }
  .upgrade-card:hover {
    transform: translateY(-6px); box-shadow: 4px 10px 0 #C93B2B; border-color: #C93B2B;
  }
  .card-preview-canvas {
    width: 190px; height: 100px; border: 1.5px solid rgba(43,42,41,0.3);
    border-radius: 4px; background: #F4EFE6; margin-bottom: 8px;
  }
  .card-name { font-size: 16px; font-weight: 900; color: #2B2A29; margin-bottom: 4px; }
  .card-type { font-size: 11px; padding: 2px 6px; border-radius: 3px; margin-bottom: 6px; font-weight: bold; }
  .type-weapon { background: #00F2FF22; color: #008CA3; border: 1px solid #00F2FF88; }
  .type-passive { background: #C93B2B22; color: #C93B2B; border: 1px solid #C93B2B88; }
  .card-desc { font-size: 12px; color: #555; text-align: center; line-height: 1.4; min-height: 36px; }

  /* 主畫面介面 */
  #main-menu {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    background: radial-gradient(circle at center, rgba(250,247,242,0.95) 0%, rgba(230,222,210,0.95) 100%);
    z-index: 90;
  }
  .game-logo {
    font-size: 54px; font-weight: 900; color: #2B2A29; letter-spacing: 4px;
    text-shadow: 3px 3px 0 #EDE5D8, 5px 5px 0 #C93B2B; margin-bottom: 8px; text-align: center;
  }
  .game-sub { font-size: 16px; color: #665; letter-spacing: 6px; margin-bottom: 24px; font-weight: bold; }
  .menu-btn-group { display: flex; flex-direction: column; gap: 14px; width: 230px; }
  .menu-btn {
    padding: 12px 0; background: #FAF7F2; border: 2px solid #2B2A29; border-radius: 8px;
    font-size: 16px; font-weight: 900; color: #2B2A29; cursor: pointer;
    box-shadow: 3px 4px 0 #2B2A29; transition: all 0.1s; text-align: center;
  }
  .menu-btn:hover { background: #C93B2B; color: #FAF7F2; border-color: #2B2A29; }
  .menu-btn:active { transform: translate(2px, 3px); box-shadow: none; }
  .currency-pill {
    position: absolute; top: 20px; right: 24px; display: flex; align-items: center; gap: 8px;
    background: #FAF7F2; border: 2px solid #2B2A29; padding: 6px 14px; border-radius: 20px;
    font-weight: 900; color: #2B2A29; box-shadow: 2px 2px 0 rgba(0,0,0,0.2);
  }

  /* 道場養成 / 成就名錄 */
  .upgrades-grid, .achieve-list {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;
    max-height: 60vh; overflow-y: auto; padding: 8px; width: 560px; max-width: 85vw;
  }
  .achieve-list { grid-template-columns: 1fr; }
  .up-item, .achieve-item {
    background: #FFF; border: 1.5px solid #2B2A29; border-radius: 6px;
    padding: 10px; display: flex; justify-content: space-between; align-items: center;
    box-shadow: 2px 2px 0 rgba(0,0,0,0.1);
  }
  .up-info h4 { font-size: 15px; color: #2B2A29; }
  .up-info p { font-size: 11px; color: #777; margin-top: 2px; }
  .up-btn {
    padding: 6px 12px; background: #00A86B; border: 1.5px solid #2B2A29; border-radius: 4px;
    color: #FFF; font-weight: 900; font-size: 12px; cursor: pointer; box-shadow: 1px 2px 0 #2B2A29;
  }
  .up-btn.disabled { background: #CCC; color: #888; cursor: not-allowed; box-shadow: none; }
  .close-board-btn {
    margin-top: 18px; width: 100%; padding: 10px 0; background: #2B2A29; color: #FAF7F2;
    border: none; border-radius: 6px; font-size: 14px; font-weight: 900; cursor: pointer;
  }
  .achieve-status { font-size: 12px; font-weight: 900; }
  .ach-done { color: #00A86B; }
  .ach-locked { color: #888; }

  /* 結算介面 */
  #game-over-modal .washi-board { text-align: center; min-width: 320px; }
  .over-stat { margin: 8px 0; font-size: 15px; color: #444; }
  .gold-earned { font-size: 22px; color: #C93B2B; font-weight: 900; margin: 12px 0; }
</style>
</head>

<script>
/* ==================== 1. 音效合成引擎 (Web Audio API) ==================== */
class SoundEngine {
  constructor() {
    this.ctx = null;
    this.init();
  }
  init() {
    const AudioCtx = window.AudioContext || window.webkitAudioContext;
    if (AudioCtx) this.ctx = new AudioCtx();
  }
  ensureCtx() {
    if (this.ctx && this.ctx.state === 'suspended') this.ctx.resume();
  }
  playSlash() {
    if (!this.ctx) return;
    this.ensureCtx();
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    const filter = this.ctx.createBiquadFilter();
    osc.type = 'sawtooth';
    osc.frequency.setValueAtTime(800, t);
    osc.frequency.exponentialRampToValueAtTime(140, t + 0.12);
    filter.type = 'lowpass';
    filter.frequency.setValueAtTime(3200, t);
    filter.frequency.exponentialRampToValueAtTime(800, t + 0.12);
    gain.gain.setValueAtTime(0.24, t);
    gain.gain.linearRampToValueAtTime(0.01, t + 0.12);
    osc.connect(filter); filter.connect(gain); gain.connect(this.ctx.destination);
    osc.start(t); osc.stop(t + 0.13);
  }
  playParry() {
    if (!this.ctx) return;
    this.ensureCtx();
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(1500, t);
    osc.frequency.exponentialRampToValueAtTime(3000, t + 0.08);
    gain.gain.setValueAtTime(0.45, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.28);
    osc.connect(gain); gain.connect(this.ctx.destination);
    osc.start(t); osc.stop(t + 0.28);
  }
  playHit() {
    if (!this.ctx) return;
    this.ensureCtx();
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(160, t);
    osc.frequency.exponentialRampToValueAtTime(40, t + 0.15);
    gain.gain.setValueAtTime(0.3, t);
    gain.gain.linearRampToValueAtTime(0.01, t + 0.15);
    osc.connect(gain); gain.connect(this.ctx.destination);
    osc.start(t); osc.stop(t + 0.16);
  }
  playCoin() {
    if (!this.ctx) return;
    this.ensureCtx();
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(987.77, t);
    osc.frequency.setValueAtTime(1318.51, t + 0.07);
    gain.gain.setValueAtTime(0.2, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.25);
    osc.connect(gain); gain.connect(this.ctx.destination);
    osc.start(t); osc.stop(t + 0.25);
  }
  playLevelUp() {
    if (!this.ctx) return;
    this.ensureCtx();
    const t = this.ctx.currentTime;
    [523.25, 659.25, 783.99, 1046.50].forEach((freq, i) => {
      const osc = this.ctx.createOscillator();
      const gain = this.ctx.createGain();
      osc.type = 'sine';
      osc.frequency.setValueAtTime(freq, t + i * 0.08);
      gain.gain.setValueAtTime(0.2, t + i * 0.08);
      gain.gain.exponentialRampToValueAtTime(0.001, t + i * 0.08 + 0.3);
      osc.connect(gain); gain.connect(this.ctx.destination);
      osc.start(t + i * 0.08); osc.stop(t + i * 0.08 + 0.32);
    });
  }
  playTaiko() {
    if (!this.ctx) return;
    this.ensureCtx();
    const t = this.ctx.currentTime;
    const osc = this.ctx.createOscillator();
    const gain = this.ctx.createGain();
    osc.type = 'sine';
    osc.frequency.setValueAtTime(120, t);
    osc.frequency.exponentialRampToValueAtTime(30, t + 0.4);
    gain.gain.setValueAtTime(0.5, t);
    gain.gain.exponentialRampToValueAtTime(0.001, t + 0.4);
    osc.connect(gain); gain.connect(this.ctx.destination);
    osc.start(t); osc.stop(t + 0.42);
  }
}
const audio = new SoundEngine();

/* ==================== 2. 存檔與天賦成就系統 ==================== */
const SAVE_KEY = "PANDA_SURVIVOR_SAVE_2026";
let userSave = {
  gold: 0,
  talents: {
    hp: 0,       // 體力上限 +35/級
    atk: 0,      // 傷害 +10%/級
    spd: 0,      // 跑速 +7%/級
    cdr: 0       // 冷卻 -6%/級
  },
  stats: {
    totalKills: 0,
    totalBossKills: 0,
    totalParries: 0,
    maxTime: 0,
    totalGold: 0
  },
  achievements: {}
};

function loadSave() {
  try {
    const raw = localStorage.getItem(SAVE_KEY);
    if (raw) {
      const parsed = JSON.parse(raw);
      userSave = {
        ...userSave,
        ...parsed,
        talents: { ...userSave.talents, ...parsed.talents },
        stats: { ...userSave.stats, ...parsed.stats },
        achievements: { ...parsed.achievements }
      };
    }
  } catch(e) { console.warn(e); }
  updateMenuGold();
}
function writeSave() {
  try { localStorage.setItem(SAVE_KEY, JSON.stringify(userSave)); } catch(e){}
  updateMenuGold();
}
function updateMenuGold() {
  const el = document.getElementById('menuGoldDisplay');
  if (el) el.innerText = userSave.gold;
}

const TALENT_DEFS = {
  hp:  { name: "金剛體魄", desc: "生命上限 +35", max: 5, baseCost: 80, costMult: 1.5 },
  atk: { name: "修羅氣勁", desc: "全武技傷害 +10%", max: 5, baseCost: 100, costMult: 1.6 },
  spd: { name: "八咫神足", desc: "浪人跑速 +7%", max: 5, baseCost: 80, costMult: 1.5 },
  cdr: { name: "明鏡心眼", desc: "武技冷卻縮減 -6%", max: 5, baseCost: 120, costMult: 1.7 }
};

const ACHIEVE_DEFS = [
  { id: 'first_blood', name: '初露鋒芒', desc: '累計斬殺 50 隻妖魔', reward: 100, check: s => s.totalKills >= 50 },
  { id: 'blade_master', name: '百人一閃', desc: '累計斬殺 300 隻妖魔', reward: 250, check: s => s.totalKills >= 300 },
  { id: 'parry_god', name: '無心見切', desc: '成功施展 15 次居合彈反', reward: 200, check: s => s.totalParries >= 15 },
  { id: 'boss_slayer', name: '退治大妖', desc: '斬殺任一首領鬼神', reward: 400, check: s => s.totalBossKills >= 1 },
  { id: 'survivor_1', name: '堅定心性', desc: '單局存活超過 3 分鐘', reward: 300, check: s => s.maxTime >= 180 },
  { id: 'rich_panda', name: '富貴貓熊', desc: '累計獲取 800 枚金判', reward: 300, check: s => s.totalGold >= 800 }
];

/* ==================== 3. 核心變數配置 ==================== */
const canvas = document.getElementById('gameCanvas');
const ctx = canvas.getContext('2d');

let gameState = 'MENU'; // 'MENU', 'PLAYING', 'UPGRADE', 'GAMEOVER'
let gameTime = 0;
let killCount = 0;
let sessionGold = 0;
let screenShake = 0;
let hitStopFrames = 0;
let lastTimestamp = 0;

function resizeCanvas() {
  canvas.width = window.innerWidth;
  canvas.height = window.innerHeight;
}
window.addEventListener('resize', resizeCanvas);
resizeCanvas();

const camera = { x: 0, y: 0 };

/* 玩家實體 */
const player = {
  x: 0, y: 0,
  radius: 20,
  maxHp: 250,
  hp: 250,
  speed: 3.5,
  facing: 1,
  aimAngle: 0,
  level: 1,
  exp: 0,
  nextExp: 20,
  ultCharge: 0,
  maxUlt: 100,
  
  // 動作狀態
  isDashing: false,
  dashCooldown: 0,
  dashTimer: 0,
  isParrying: false,
  parryTimer: 0,
  parryCooldown: 0,
  invincibleTimer: 0,
  
  // 動態表現
  breath: 0,
  walkCycle: 0,
  blinkTimer: 180,
  isBlinking: false,
  
  // 技能
  weapons: {},
  passives: {},

  initTalents() {
    this.maxHp = 250 + userSave.talents.hp * 35;
    this.hp = this.maxHp;
    this.speed = 3.5 * (1 + userSave.talents.spd * 0.07);
    this.damageMult = 1 + userSave.talents.atk * 0.10;

    this.weapons = {
      bamboo_slash: { level: 1, timer: 0 }
    };
    this.passives = {};
  }
};

/* ==================== 5. 動態預覽卡牌繪製 (Mini Canvas) ==================== */
function renderMiniPreview(cEl, skillKey, frame) {
  const c = cEl.getContext('2d');
  const w = cEl.width, h = cEl.height;
  c.clearRect(0, 0, w, h);
  c.save();
  c.translate(w / 2, h / 2);

  // 迷你貓熊投影
  c.fillStyle = 'rgba(43,42,41,0.15)';
  c.beginPath(); c.ellipse(0, 22, 16, 6, 0, 0, Math.PI * 2); c.fill();

  if (skillKey === 'bamboo_slash') {
    const sweep = (frame * 0.12) % (Math.PI * 2);
    c.strokeStyle = '#00F2FF'; c.lineWidth = 4; c.lineCap = 'round';
    c.beginPath(); c.arc(0, 0, 32, sweep, sweep + 1.2); c.stroke();
    c.strokeStyle = '#2B2A29'; c.lineWidth = 1.5;
    c.beginPath(); c.arc(0, 0, 35, sweep, sweep + 1.1); c.stroke();
  } else if (skillKey === 'ofuda_flame') {
    const t = frame * 0.08;
    for (let i = 0; i < 3; i++) {
      const a = t + i * 2.1;
      const r = 24 + Math.sin(t * 2 + i) * 8;
      const ox = Math.cos(a) * r, oy = Math.sin(a) * r;
      c.save(); c.translate(ox, oy); c.rotate(a);
      c.fillStyle = '#FAF7F2'; c.strokeStyle = '#FF2A4D'; c.lineWidth = 1.5;
      c.fillRect(-4, -8, 8, 16); c.strokeRect(-4, -8, 8, 16);
      c.fillStyle = '#00F2FF'; c.beginPath(); c.arc(0, 10, 3, 0, Math.PI*2); c.fill();
      c.restore();
    }
  } else if (skillKey === 'sakura_storm') {
    const t = frame * 0.1;
    for (let i = 0; i < 5; i++) {
      const a = t + (i * Math.PI * 2 / 5);
      const ox = Math.cos(a) * 36, oy = Math.sin(a) * 36;
      c.fillStyle = '#FF4081';
      c.beginPath(); c.ellipse(ox, oy, 6, 3, a, 0, Math.PI * 2); c.fill();
    }
  } else if (skillKey === 'thunder_strike') {
    if (Math.floor(frame / 12) % 2 === 0) {
      c.strokeStyle = '#FFB300'; c.lineWidth = 3;
      c.beginPath();
      c.moveTo(20, -40); c.lineTo(10, -10); c.lineTo(25, 0); c.lineTo(15, 25);
      c.stroke();
      c.strokeStyle = '#00F2FF'; c.lineWidth = 1.5; c.stroke();
    }
  } else {
    const r = 22 + Math.sin(frame * 0.1) * 4;
    c.strokeStyle = '#00A86B'; c.lineWidth = 2.5; c.setLineDash([4, 4]);
    c.beginPath(); c.arc(0, 0, r, 0, Math.PI * 2); c.stroke();
  }
  c.restore();
}

let previewAnimFrame = 0;
function animateUpgradePreviews() {
  if (gameState !== 'UPGRADE') return;
  previewAnimFrame++;
  document.querySelectorAll('.card-preview-canvas').forEach(cvs => {
    const k = cvs.getAttribute('data-skill');
    if (k) renderMiniPreview(cvs, k, previewAnimFrame);
  });
  requestAnimationFrame(animateUpgradePreviews);
}

    ctx.beginPath(); ctx.moveTo(-20, -26); ctx.quadraticCurveTo(-45, -50, -32, -65); ctx.quadraticCurveTo(-25, -45, -10, -32); ctx.fill();
    ctx.beginPath(); ctx.moveTo(20, -26); ctx.quadraticCurveTo(45, -50, 32, -65); ctx.quadraticCurveTo(25, -45, 10, -32); ctx.fill();
    ctx.fillStyle = '#FFD600'; ctx.beginPath(); ctx.arc(-14, -6, 6, 0, Math.PI*2); ctx.arc(14, -6, 6, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#D50000'; ctx.beginPath(); ctx.arc(-14, -6, 3, 0, Math.PI*2); ctx.arc(14, -6, 3, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = '#212121'; ctx.beginPath(); ctx.arc(0, 16, 14, 0, Math.PI); ctx.fill();
  }
  else if (e.kind === 'boss_tamamo') {
    ctx.fillStyle = 'rgba(156, 39, 176, 0.25)';
    ctx.beginPath(); ctx.arc(0, 0, 52, 0, Math.PI*2); ctx.fill();
    for (let i = 0; i < 9; i++) {
      const a = gameTime * 3 + (i * Math.PI * 2 / 9);
      ctx.fillStyle = '#D500F9';
      ctx.beginPath(); ctx.arc(Math.cos(a) * 44, Math.sin(a) * 44, 7, 0, Math.PI*2); ctx.fill();

  // 血條
  if (e.hp < e.maxHp) {

    ctx.fillStyle = 'rgba(0,0,0,0.5)'; ctx.fillRect(-bw/2, -e.radius - 12, bw, 5);
    ctx.fillStyle = '#FF1744'; ctx.fillRect(-bw/2, -e.radius - 12, bw * pct, 5);
  }

  ctx.restore();
}

/* ==================== 8. 招式特效與居合見切彈反 ==================== */
function updateAndDrawProjectiles(ctx, dt) {
  for (let i = projectiles.length - 1; i >= 0; i--) {
    const p = projectiles[i];
    p.life -= dt;
    if (p.life <= 0) { projectiles.splice(i, 1); continue; }

    if (p.type === 'bamboo_slash') {
      p.x += p.vx; p.y += p.vy;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.angle);
      // 水藍極光刀刃特效
      ctx.strokeStyle = '#00F2FF';
      ctx.lineWidth = 6; ctx.lineCap = 'round';
      ctx.beginPath(); ctx.arc(0, 0, p.radius, -0.7, 0.7); ctx.stroke();
      ctx.strokeStyle = '#2B2A29'; ctx.lineWidth = 2;
      ctx.beginPath(); ctx.arc(2, 0, p.radius - 3, -0.6, 0.6); ctx.stroke();
      ctx.restore();

      checkPlayerProjHit(p, 1);
    }
    else if (p.type === 'ofuda') {
      if (!p.target || p.target.hp <= 0) {
        let minD = 500, closest = null;
        for (let e of enemies) {
          const d = Math.hypot(e.x - p.x, e.y - p.y);
          if (d < minD) { minD = d; closest = e; }
        }
        p.target = closest;
      }
      if (p.target) {
        const ta = Math.atan2(p.target.y - p.y, p.target.x - p.x);
        p.angle += (ta - p.angle) * 0.15;
      }
      p.x += Math.cos(p.angle) * p.speed;
      p.y += Math.sin(p.angle) * p.speed;

      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.angle);
      ctx.fillStyle = '#FAF7F2'; ctx.strokeStyle = '#FF2A4D'; ctx.lineWidth = 1.8;
      ctx.fillRect(-7, -12, 14, 24); ctx.strokeRect(-7, -12, 14, 24);
      ctx.fillStyle = '#00F2FF'; ctx.beginPath(); ctx.arc(0, 8, 3.5, 0, Math.PI*2); ctx.fill();
      ctx.restore();

      checkPlayerProjHit(p, 0);
    }
    else if (p.type === 'sakura') {
      p.orbitAngle += dt * 4;
      p.x = player.x + Math.cos(p.orbitAngle) * p.dist;
      p.y = player.y + Math.sin(p.orbitAngle) * p.dist;

      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.rotate(p.orbitAngle);
      ctx.fillStyle = '#FF4081';
      ctx.beginPath(); ctx.ellipse(0, 0, 9, 4, 0, 0, Math.PI*2); ctx.fill();
      ctx.restore();

      checkPlayerProjHit(p, 2);
    }
    else if (p.type === 'reflected_orb') {
      p.x += p.vx; p.y += p.vy;
      ctx.save();
      ctx.translate(p.x, p.y);
      ctx.fillStyle = '#00F2FF'; ctx.beginPath(); ctx.arc(0, 0, 9, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#FFFFFF'; ctx.lineWidth = 2; ctx.stroke();
      ctx.restore();

      checkPlayerProjHit(p, 0);
    }
  }

  // 妖魔攻擊：嚴格使用鮮紅與妖紫，不准用藍色
  for (let i = enemyProjectiles.length - 1; i >= 0; i--) {
    const ep = enemyProjectiles[i];
    ep.life -= dt;
    if (ep.life <= 0) { enemyProjectiles.splice(i, 1); continue; }

    ep.x += ep.vx; ep.y += ep.vy;

    // 居合見切彈反判定
    if (player.isParrying) {
      const d = Math.hypot(ep.x - player.x, ep.y - player.y);
      if (d < 45) {
        audio.playParry();
        screenShake = 12;
        hitStopFrames = 5;
        userSave.stats.totalParries++;
        const revAng = Math.atan2(ep.y - player.y, ep.x - player.x);
        projectiles.push({
          type: 'reflected_orb',
          x: ep.x, y: ep.y,
          vx: Math.cos(revAng) * 12,
          vy: Math.sin(revAng) * 12,
          dmg: ep.dmg * 2.5,
          life: 2.0, hits: new Set()
        });
        showPopup(player.x, player.y - 30, '見切！', '#00F2FF', 22);
        enemyProjectiles.splice(i, 1);
        continue;
      }
    }

    const pDist = Math.hypot(ep.x - player.x, ep.y - player.y);
    if (pDist < player.radius + ep.radius) {
      if (player.invincibleTimer <= 0 && !player.isDashing) {
        takeDamage(ep.dmg);
      }
      enemyProjectiles.splice(i, 1);
      continue;
    }

    ctx.save();
    ctx.translate(ep.x, ep.y);
    ctx.fillStyle = ep.color || '#FF1744';
    ctx.beginPath(); ctx.arc(0, 0, ep.radius || 6, 0, Math.PI*2); ctx.fill();
    ctx.strokeStyle = '#D50000'; ctx.lineWidth = 2; ctx.stroke();
    ctx.restore();
  }
}

function checkPlayerProjHit(p, mode) {
  for (let e of enemies) {
    if (p.hits.has(e)) continue;
    const d = Math.hypot(e.x - p.x, e.y - p.y);
    if (d < e.radius + (p.radius || 10)) {
      p.hits.add(e);
      damageEnemy(e, p.dmg);
      audio.playHit();
      if (mode === 1) {
        p.pierce--;
        if (p.pierce <= 0) { p.life = 0; break; }
      } else if (mode === 0) {
        p.life = 0; break;
      }
    }
  }
}

function triggerThunderArea(x, y, radius, dmg) {
  for (let e of enemies) {
    if (Math.hypot(e.x - x, e.y - y) < radius + e.radius) {
      damageEnemy(e, dmg);
    }
  }
  for (let i = 0; i < 14; i++) {
    particles.push({
      x, y, vx: (Math.random()-0.5)*12, vy: (Math.random()-0.5)*12,
      color: Math.random()>0.5 ? '#FFD600' : '#00F2FF', life: 0.35, size: 4
    });
  }
}

/* ==================== 9. 傷害計算、擊殺、金判與成就 ==================== */
function damageEnemy(e, dmg) {
  e.hp -= dmg;
  showPopup(e.x, e.y, Math.round(dmg), '#2B2A29', 14);
  if (e.hp <= 0) {
    killEnemy(e);
  }
}

function killEnemy(e) {
  const idx = enemies.indexOf(e);
  if (idx !== -1) enemies.splice(idx, 1);

  killCount++;
  userSave.stats.totalKills++;
  if (e.kind.startsWith('boss')) userSave.stats.totalBossKills++;

  pickups.push({ x: e.x, y: e.y, type: 'magatama', exp: e.expValue || 5 });

  if (Math.random() < 0.35 || e.kind.startsWith('boss')) {
    const val = e.kind.startsWith('boss') ? 50 : Math.floor(Math.random() * 3 + 1);
    pickups.push({
      x: e.x + (Math.random() - 0.5) * 16,
      y: e.y + (Math.random() - 0.5) * 16,
      type: 'gold', val
    });
  }

  for (let i = 0; i < 12; i++) {
    particles.push({
      x: e.x, y: e.y,
      vx: (Math.random() - 0.5) * 8, vy: (Math.random() - 0.5) * 8,
      color: Math.random() > 0.4 ? '#FF2A4D' : '#00F2FF',
      life: 0.4, size: 4
    });
  }

  player.ultCharge = Math.min(player.maxUlt, player.ultCharge + 1.8);
  checkAchievements();
}

function takeDamage(dmg) {
  const reduction = (player.passives.iron_body ? player.passives.iron_body.level * 0.12 : 0);
  const realDmg = Math.max(1, dmg * (1 - reduction));
  player.hp -= realDmg;
  player.invincibleTimer = 0.35;
  screenShake = 10;
  audio.playHit();
  showPopup(player.x, player.y - 20, `-${Math.round(realDmg)}`, '#FF1744', 18);
  if (player.hp <= 0) {
    player.hp = 0;
    triggerGameOver();
  }
}

function showPopup(x, y, text, color, size = 16) {
  textPopups.push({ x, y, text, color, size, life: 0.7 });
}

function checkAchievements() {
  ACHIEVE_DEFS.forEach(a => {
    if (!userSave.achievements[a.id] && a.check(userSave.stats)) {
      userSave.achievements[a.id] = true;
      userSave.gold += a.reward;
      showPopup(player.x, player.y - 60, `【成就達成】${a.name}`, '#FFB300', 18);
      writeSave();
    }
  });
}

/* ==================== 10. 全螢幕斷斬奧義 ==================== */
function triggerUltimate() {
  if (player.ultCharge < player.maxUlt) return;
  player.ultCharge = 0;
  audio.playTaiko();
  screenShake = 22;
  hitStopFrames = 12;

  for (let i = 0; i < 8; i++) {
    setTimeout(() => {
      audio.playSlash();
      enemies.forEach(e => {
        damageEnemy(e, (160 + player.level * 25) * player.damageMult);
      });
      for (let k = 0; k < 20; k++) {
        particles.push({
          x: camera.x + Math.random() * canvas.width,
          y: camera.y + Math.random() * canvas.height,
          vx: (Math.random() - 0.5) * 16, vy: (Math.random() - 0.5) * 16,
          color: Math.random() > 0.5 ? '#00F2FF' : '#FF1744',
          life: 0.5, size: 5
        });
      }
    }, i * 70);
  }
  showPopup(player.x, player.y - 40, '奧義・天魔滅絕！', '#FF1744', 28);
}

/* ==================== 11. 地圖物件：神社石燈與古壺 ==================== */
function initDestructibles() {
  destructibles = [];
  for (let i = 0; i < 35; i++) {
    destructibles.push({
      x: (Math.random() - 0.5) * 3600,
      y: (Math.random() - 0.5) * 3600,
      hp: 3,
      type: Math.random() > 0.5 ? 'lantern' : 'pot'
    });
  }
}

function updateDestructibles(ctx) {
  for (let i = destructibles.length - 1; i >= 0; i--) {
    const d = destructibles[i];
    for (let p of projectiles) {
      if (Math.hypot(p.x - d.x, p.y - d.y) < 25) {
        d.hp--;
        if (d.hp <= 0) break;
      }
    }
    if (d.hp <= 0) {
      if (Math.random() > 0.4) {
        pickups.push({ x: d.x, y: d.y, type: 'onigiri', val: 50 });
      } else {
        pickups.push({ x: d.x, y: d.y, type: 'gold', val: 5 });
      }
      destructibles.splice(i, 1);
      continue;
    }

    ctx.save();
    ctx.translate(d.x, d.y);
    if (d.type === 'lantern') {
      ctx.fillStyle = '#9E9E9E'; ctx.fillRect(-8, -14, 16, 26);
      ctx.fillStyle = '#D7CCC8'; ctx.fillRect(-12, -22, 24, 8);
      ctx.fillStyle = '#FFEB3B'; ctx.fillRect(-4, -10, 8, 8);
    } else {
      ctx.fillStyle = '#8D6E63'; ctx.beginPath(); ctx.ellipse(0, 0, 10, 12, 0, 0, Math.PI*2); ctx.fill();
    }
    ctx.restore();
  }
}

/* ==================== 12. 升級三選一 ==================== */
function checkLevelUp() {
  if (player.exp >= player.nextExp) {
    player.exp -= player.nextExp;
    player.level++;
    player.nextExp = Math.floor(player.nextExp * 1.35 + 10);
    audio.playLevelUp();
    showUpgradeMenu();
  }
}

function showUpgradeMenu() {
  gameState = 'UPGRADE';
  const container = document.getElementById('upgradeCards');
  container.innerHTML = '';
  document.getElementById('upgrade-modal').style.display = 'flex';

  const choices = getUpgradeChoices();
  choices.forEach(ch => {
    const card = document.createElement('div');
    card.className = 'upgrade-card';
    card.innerHTML = `
      <canvas class="card-preview-canvas" width="190" height="100" data-skill="${ch.key}"></canvas>
      <div class="card-name">${ch.name}</div>
      <div class="card-type ${ch.isWeapon ? 'type-weapon' : 'type-passive'}">${ch.isWeapon ? '主動武技' : '心法被動'}・Lv.${ch.nextLvl}</div>
      <div class="card-desc">${ch.desc}</div>
    `;
    card.onclick = () => {
      applyUpgrade(ch);
      document.getElementById('upgrade-modal').style.display = 'none';
      gameState = 'PLAYING';
    };
    container.appendChild(card);
  });

  previewAnimFrame = 0;
  animateUpgradePreviews();
}

function getUpgradeChoices() {
  const pool = [];
  for (let key in SKILL_DATABASE) {
    const def = SKILL_DATABASE[key];
    const isW = def.type === 'weapon';
    const curLvl = isW ? (player.weapons[key]?.level || 0) : (player.passives[key]?.level || 0);
    if (curLvl < def.maxLvl) {
      pool.push({
        key, name: def.name, isWeapon: isW,
        nextLvl: curLvl + 1, desc: def.desc
      });
    }
  }
  pool.sort(() => Math.random() - 0.5);
  return pool.slice(0, 3);
}

function applyUpgrade(ch) {
  if (ch.isWeapon) {
    if (!player.weapons[ch.key]) {
      player.weapons[ch.key] = { level: 1, timer: 0 };
    } else {
      player.weapons[ch.key].level++;
    }
  } else {
    if (!player.passives[ch.key]) {
      player.passives[ch.key] = { level: 1 };
    } else {
      player.passives[ch.key].level++;
    }
  }
}

/* ==================== 13. 魔物生成與難度控制 ==================== */
let spawnTimer = 0;
let bossSpawned1 = false;
let bossSpawned2 = false;

function updateSpawns(dt) {
  spawnTimer += dt;
  const rate = Math.max(0.25, 1.2 - (gameTime / 240) * 0.8);

  if (spawnTimer >= rate) {
    spawnTimer = 0;
    spawnEnemyBatch();
  }

  if (gameTime >= 90 && !bossSpawned1) {
    bossSpawned1 = true;
    spawnBoss('boss_hanya', 3500, '【羅剎般若・牛頭鬼神】');
  }
  if (gameTime >= 210 && !bossSpawned2) {
    bossSpawned2 = true;
    spawnBoss('boss_tamamo', 6500, '【大嶽丸・九尾夜叉尊】');
  }
}

function spawnEnemyBatch() {
  const count = Math.min(18, 2 + Math.floor(gameTime / 20));
  const kinds = ['tengu', 'ashigaru'];
  if (gameTime > 40) kinds.push('kitsune');
  if (gameTime > 80) kinds.push('oni');

  for (let i = 0; i < count; i++) {
    const ang = Math.random() * Math.PI * 2;
    const dist = 450 + Math.random() * 150;
    const kind = kinds[Math.floor(Math.random() * kinds.length)];
    let hp = 30 + (gameTime * 1.5);
    let spd = 2.0;
    let rad = 14;

    if (kind === 'tengu') { spd = 3.2; hp *= 0.7; }
    if (kind === 'oni') { spd = 1.3; hp *= 2.8; rad = 24; }

    enemies.push({
      kind, x: player.x + Math.cos(ang) * dist, y: player.y + Math.sin(ang) * dist,
      vx: 0, vy: 0, hp, maxHp: hp, speed: spd, radius: rad,
      expValue: kind === 'oni' ? 25 : 8,
      shootTimer: Math.random() * 2
    });
  }
}

function spawnBoss(kind, hp, name) {
  audio.playTaiko();
  screenShake = 20;
  showPopup(player.x, player.y - 80, `神話大妖降臨！${name}`, '#FF1744', 26);
  const ang = Math.random() * Math.PI * 2;
  enemies.push({
    kind, x: player.x + Math.cos(ang) * 450, y: player.y + Math.sin(ang) * 450,
    vx: 0, vy: 0, hp, maxHp: hp, speed: 1.6, radius: 40,
    expValue: 300, shootTimer: 0
  });
}

/* ==================== 14. 遊戲主循環與輸入判定 ==================== */
const keys = {};
window.addEventListener('keydown', e => {
  keys[e.key.toLowerCase()] = true;
  if (e.key === ' ' || e.code === 'Space') doParry();
  if (e.key === 'Shift' || e.key.toLowerCase() === 'q') doDash();
  if (e.key.toLowerCase() === 'e') triggerUltimate();
});
window.addEventListener('keyup', e => { keys[e.key.toLowerCase()] = false; });

function doDash() {
  if (player.dashCooldown > 0 || player.isDashing) return;
  player.isDashing = true;
  player.dashTimer = 0.22;
  const reduction = player.passives.gale_stride ? player.passives.gale_stride.level * 0.1 : 0;
  player.dashCooldown = Math.max(0.6, 1.2 * (1 - reduction));
  player.invincibleTimer = 0.26;
  audio.playSlash();
}

function doParry() {
  if (player.parryCooldown > 0 || player.isParrying) return;
  player.isParrying = true;
  player.parryTimer = 0.22;
  player.parryCooldown = 0.7;
}

// 虛擬搖桿
const joy = { active: false, dx: 0, dy: 0, touchId: null };
const joyZone = document.getElementById('joystick-zone');
const joyStick = document.getElementById('joyStick');

function handleTouchStart(e) {
  for (let t of e.changedTouches) {
    const rect = joyZone.getBoundingClientRect();
    if (t.clientX >= rect.left && t.clientX <= rect.right && t.clientY >= rect.top && t.clientY <= rect.bottom) {
      joy.active = true;
      joy.touchId = t.identifier;
      updateJoy(t.clientX, t.clientY, rect);
      break;
    }
  }
}
function handleTouchMove(e) {
  if (!joy.active) return;
  for (let t of e.changedTouches) {
    if (t.identifier === joy.touchId) {
      updateJoy(t.clientX, t.clientY, joyZone.getBoundingClientRect());
      break;
    }
  }
}
function handleTouchEnd(e) {
  for (let t of e.changedTouches) {
    if (t.identifier === joy.touchId) {
      joy.active = false;
      joy.dx = 0; joy.dy = 0;
      joyStick.style.top = '40px'; joyStick.style.left = '40px';
      break;
    }
  }
}
function updateJoy(cx, cy, r) {
  const cx0 = r.left + r.width / 2, cy0 = r.top + r.height / 2;
  let dx = cx - cx0, dy = cy - cy0;
  const dist = Math.hypot(dx, dy);
  const maxR = r.width / 2;
  if (dist > maxR) { dx = (dx / dist) * maxR; dy = (dy / dist) * maxR; }
  joyStick.style.left = `${40 + dx}px`;
  joyStick.style.top = `${40 + dy}px`;
  joy.dx = dx / maxR; joy.dy = dy / maxR;
}
window.addEventListener('touchstart', handleTouchStart, { passive: false });
window.addEventListener('touchmove', handleTouchMove, { passive: false });
window.addEventListener('touchend', handleTouchEnd, { passive: false });

document.getElementById('btnDash').onclick = doDash;
document.getElementById('btnParry').onclick = doParry;
document.getElementById('btnUlt').onclick = triggerUltimate;

function gameLoop(timestamp) {
  requestAnimationFrame(gameLoop);
  if (!lastTimestamp) lastTimestamp = timestamp;
  const dt = Math.min(0.1, (timestamp - lastTimestamp) / 1000);
  lastTimestamp = timestamp;

  if (gameState !== 'PLAYING') return;

  if (hitStopFrames > 0) { hitStopFrames--; return; }

  gameTime += dt;
  userSave.stats.maxTime = Math.max(userSave.stats.maxTime, gameTime);

  // 移動
  let mx = 0, my = 0;
  if (keys['w'] || keys['arrowup']) my -= 1;
  if (keys['s'] || keys['arrowdown']) my += 1;
  if (keys['a'] || keys['arrowleft']) mx -= 1;
  if (keys['d'] || keys['arrowright']) mx += 1;

  if (joy.active) { mx = joy.dx; my = joy.dy; }

  const len = Math.hypot(mx, my);
  if (len > 0) {
    const spd = player.isDashing ? player.speed * 2.3 : player.speed;
    player.x += (mx / len) * spd;
    player.y += (my / len) * spd;
    player.facing = mx >= 0 ? 1 : -1;
    player.walkCycle += dt * 14;
    player.aimAngle = Math.atan2(my, mx);
  } else {
    player.walkCycle = 0;
  }

  // 呼吸與眨眼
  player.breath += dt * 3.5;
  player.blinkTimer--;
  if (player.blinkTimer <= 0) {
    player.isBlinking = true;
    if (player.blinkTimer <= -10) { player.isBlinking = false; player.blinkTimer = 160 + Math.random() * 80; }
  }

  if (player.dashCooldown > 0) player.dashCooldown -= dt;
  if (player.dashTimer > 0) { player.dashTimer -= dt; if (player.dashTimer <= 0) player.isDashing = false; }
  if (player.parryCooldown > 0) player.parryCooldown -= dt;
  if (player.parryTimer > 0) { player.parryTimer -= dt; if (player.parryTimer <= 0) player.isParrying = false; }
  if (player.invincibleTimer > 0) player.invincibleTimer -= dt;

  if (player.passives.iron_body) {
    player.hp = Math.min(player.maxHp, player.hp + player.passives.iron_body.level * 0.8 * dt);
  }

  // 技能冷卻與觸發
  for (let key in player.weapons) {
    const wInst = player.weapons[key];
    const wDef = SKILL_DATABASE[key];
    wInst.timer += dt;
    const cooldown = wDef.cd * player.cdrMult;
    if (wInst.timer >= cooldown) {
      wInst.timer = 0;
      wDef.attack(wInst.level);
    }
  }

  // 敵群行為
  updateSpawns(dt);
  for (let i = enemies.length - 1; i >= 0; i--) {
    const e = enemies[i];
    const dx = player.x - e.x, dy = player.y - e.y;
    const d = Math.hypot(dx, dy);

    if (d > 0) {
      e.vx = (dx / d) * e.speed;
      e.vy = (dy / d) * e.speed;
      e.x += e.vx; e.y += e.vy;
    }

    if (d < e.radius + player.radius) {
      if (!player.isDashing && player.invincibleTimer <= 0) {
        takeDamage(e.kind.startsWith('boss') ? 35 : 12);
      }
    }

    // 妖氣彈（嚴格鮮紅與妖紫）
    if (e.kind === 'kitsune' || e.kind.startsWith('boss')) {
      e.shootTimer += dt;
      const interval = e.kind.startsWith('boss') ? 1.5 : 3.0;
      if (e.shootTimer >= interval) {
        e.shootTimer = 0;
        const ang = Math.atan2(dy, dx);
        if (e.kind === 'kitsune') {
          enemyProjectiles.push({
            x: e.x, y: e.y, vx: Math.cos(ang) * 4.5, vy: Math.sin(ang) * 4.5,
            radius: 7, dmg: 16, life: 3.5, color: '#D500F9'
          });
        } else {
          for (let k = 0; k < 8; k++) {
            const sang = ang + (k * Math.PI * 2 / 8);
            enemyProjectiles.push({
              x: e.x, y: e.y, vx: Math.cos(sang) * 4.2, vy: Math.sin(sang) * 4.2,
              radius: 9, dmg: 26, life: 4.5, color: '#FF1744'
            });
          }
        }
      }
    }
  }

  // 掉落物拾取
  const magnetRange = 75 + (player.passives.soul_magnet ? player.passives.soul_magnet.level * 45 : 0);
  for (let i = pickups.length - 1; i >= 0; i--) {
    const p = pickups[i];
    const d = Math.hypot(player.x - p.x, player.y - p.y);
    if (d < magnetRange) {
      p.x += (player.x - p.x) * 0.18;
      p.y += (player.y - p.y) * 0.18;
    }
    if (d < player.radius + 12) {
      if (p.type === 'magatama') {
        player.exp += p.exp;
        checkLevelUp();
      } else if (p.type === 'gold') {
        sessionGold += p.val;
        userSave.gold += p.val;
        userSave.stats.totalGold += p.val;
        audio.playCoin();
        showPopup(p.x, p.y, `+${p.val}🪙`, '#FFB300', 14);
      } else if (p.type === 'onigiri') {
        player.hp = Math.min(player.maxHp, player.hp + p.val);
        showPopup(p.x, p.y, `+${p.val} HP`, '#00A86B', 16);
      }
      pickups.splice(i, 1);
    }
  }

  // 鏡頭
  camera.x += (player.x - canvas.width / 2 - camera.x) * 0.1;
  camera.y += (player.y - canvas.height / 2 - camera.y) * 0.1;

  renderScene();
  updateHUD();
}

/* ==================== 15. 畫面渲染 ==================== */
function renderScene() {
  ctx.save();

  let sx = 0, sy = 0;
  if (screenShake > 0) {
    sx = (Math.random() - 0.5) * screenShake;
    sy = (Math.random() - 0.5) * screenShake;
    screenShake *= 0.88;
    if (screenShake < 0.5) screenShake = 0;
  }
  ctx.translate(-camera.x + sx, -camera.y + sy);

  drawBackgroundMap(ctx);
  updateDestructibles(ctx);

  pickups.forEach(p => {
    ctx.save();
    ctx.translate(p.x, p.y);
    if (p.type === 'magatama') {
      ctx.fillStyle = '#00F2FF'; ctx.beginPath(); ctx.arc(0, 0, 5, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#2B2A29'; ctx.lineWidth = 1.2; ctx.stroke();
    } else if (p.type === 'gold') {
      ctx.fillStyle = '#FFB300'; ctx.beginPath(); ctx.ellipse(0, 0, 6, 8, 0, 0, Math.PI*2); ctx.fill();
      ctx.strokeStyle = '#8D6E63'; ctx.stroke();
    } else {
      ctx.fillStyle = '#FAF7F2'; ctx.beginPath(); ctx.moveTo(0, -7); ctx.lineTo(7, 5); ctx.lineTo(-7, 5); ctx.closePath(); ctx.fill();
      ctx.fillStyle = '#2B2A29'; ctx.fillRect(-3, 0, 6, 5);
    }
    ctx.restore();
  });

  enemies.forEach(e => drawEnemy(ctx, e));
  drawPandaRonin(ctx, player);
  updateAndDrawProjectiles(ctx, 0.016);

  // 粒子
  for (let i = particles.length - 1; i >= 0; i--) {
    const pt = particles[i];
    pt.life -= 0.02;
    if (pt.life <= 0) { particles.splice(i, 1); continue; }
    pt.x += pt.vx; pt.y += pt.vy;
    ctx.fillStyle = pt.color;
    ctx.beginPath(); ctx.arc(pt.x, pt.y, pt.size, 0, Math.PI*2); ctx.fill();
  }

  // 飄字
  for (let i = textPopups.length - 1; i >= 0; i--) {
    const tp = textPopups[i];
    tp.life -= 0.02;
    if (tp.life <= 0) { textPopups.splice(i, 1); continue; }
    tp.y -= 0.8;
    ctx.font = `900 ${tp.size}px 'Noto Serif TC'`;
    ctx.fillStyle = tp.color;
    ctx.fillText(tp.text, tp.x, tp.y);
  }

  ctx.restore();
}

function drawBackgroundMap(ctx) {
  const startX = Math.floor((camera.x - 100) / 160) * 160;
  const endX = startX + canvas.width + 320;
  const startY = Math.floor((camera.y - 100) / 160) * 160;
  const endY = startY + canvas.height + 320;

  ctx.strokeStyle = 'rgba(43, 42, 41, 0.05)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  for (let x = startX; x <= endX; x += 160) {
    ctx.moveTo(x, startY); ctx.lineTo(x, endY);
  }
  for (let y = startY; y <= endY; y += 160) {
    ctx.moveTo(startX, y); ctx.lineTo(endX, y);
  }
  ctx.stroke();
}

function updateHUD() {
  document.getElementById('hudLevel').innerText = player.level;
  const m = Math.floor(gameTime / 60).toString().padStart(2, '0');
  const s = Math.floor(gameTime % 60).toString().padStart(2, '0');
  document.getElementById('hudTime').innerText = `${m}:${s}`;
  document.getElementById('hudKills').innerText = killCount;
  document.getElementById('hudGold').innerText = sessionGold;

  const expPct = Math.min(100, (player.exp / player.nextExp) * 100);
  document.getElementById('expFill').style.width = `${expPct}%`;

  const hpPct = Math.max(0, (player.hp / player.maxHp) * 100);
  document.getElementById('hpFill').style.width = `${hpPct}%`;
  document.getElementById('hpTxt').innerText = `${Math.ceil(player.hp)}/${player.maxHp}`;

  const ultPct = (player.ultCharge / player.maxUlt) * 100;
  document.getElementById('ultFill').style.width = `${ultPct}%`;
  document.getElementById('ultTxt').style.color = ultPct >= 100 ? '#FF1744' : '#888';
}

/* ==================== 16. 道場強化與結算介面 ==================== */
function openDojo() {
  const grid = document.getElementById('dojoGrid');
  grid.innerHTML = '';
  for (let k in TALENT_DEFS) {
    const t = TALENT_DEFS[k];
    const lvl = userSave.talents[k];
    const cost = Math.floor(t.baseCost * Math.pow(t.costMult, lvl));
    const isMax = lvl >= t.max;
    const canBuy = userSave.gold >= cost && !isMax;

    const item = document.createElement('div');
    item.className = 'up-item';
    item.innerHTML = `
      <div class="up-info">
        <h4>${t.name} (階位: ${lvl}/${t.max})</h4>
        <p>${t.desc}</p>
      </div>
      <button class="up-btn ${canBuy ? '' : 'disabled'}">
        ${isMax ? '已達極意' : `${cost} 🪙`}
      </button>
    `;
    const btn = item.querySelector('.up-btn');
    if (canBuy) {
      btn.onclick = () => {
        userSave.gold -= cost;
        userSave.talents[k]++;
        writeSave();
        openDojo();
      };
    }
    grid.appendChild(item);
  }
  document.getElementById('dojo-modal').style.display = 'flex';
}

function openAchievements() {
  const list = document.getElementById('achieveList');
  list.innerHTML = '';
  ACHIEVE_DEFS.forEach(a => {
    const done = !!userSave.achievements[a.id];
    const item = document.createElement('div');
    item.className = 'achieve-item';
    item.innerHTML = `
      <div>
        <h4>${a.name}</h4>
        <p style="font-size:12px; color:#666;">${a.desc}</p>
      </div>
      <div class="achieve-status ${done ? 'ach-done' : 'ach-locked'}">
        ${done ? '✓ 領取完成' : `獎勵 ${a.reward} 🪙`}
      </div>
    `;
    list.appendChild(item);
  });
  document.getElementById('achieve-modal').style.display = 'flex';
}

function triggerGameOver() {
  gameState = 'GAMEOVER';
  // 分數折算金判獎勵
  const bonusFromScore = Math.floor(killCount * 0.8 + gameTime * 0.3);
  sessionGold += bonusFromScore;
  userSave.gold += bonusFromScore;
  userSave.stats.totalGold += bonusFromScore;
  writeSave();

  const m = Math.floor(gameTime / 60).toString().padStart(2, '0');
  const s = Math.floor(gameTime % 60).toString().padStart(2, '0');
  document.getElementById('overTime').innerText = `${m}:${s}`;
  document.getElementById('overKills').innerText = killCount;
  document.getElementById('overGold').innerText = sessionGold;
  document.getElementById('game-over-modal').style.display = 'flex';
}

/* ==================== 17. 事件綁定與遊戲啟動 ==================== */
document.getElementById('btnStartGame').onclick = () => {
  audio.playSlash();
  document.getElementById('main-menu').style.display = 'none';
  if ('ontouchstart' in window) {
    document.getElementById('touch-controls').style.display = 'block';
  }
  startNewRun();
};
document.getElementById('btnOpenDojo').onclick = openDojo;
document.getElementById('btnCloseDojo').onclick = () => {
  document.getElementById('dojo-modal').style.display = 'none';
};
document.getElementById('btnOpenAchieve').onclick = openAchievements;
document.getElementById('btnCloseAchieve').onclick = () => {
  document.getElementById('achieve-modal').style.display = 'none';
};
document.getElementById('btnRestart').onclick = () => {
  document.getElementById('game-over-modal').style.display = 'none';
  document.getElementById('main-menu').style.display = 'flex';
};

function startNewRun() {
  gameTime = 0;
  killCount = 0;
  sessionGold = 0;
  enemies = [];
  projectiles = [];
  enemyProjectiles = [];
  pickups = [];
  particles = [];
  textPopups = [];
  bossSpawned1 = false;
  bossSpawned2 = false;

  player.x = 0; player.y = 0;
  player.level = 1; player.exp = 0; player.nextExp = 20;
  player.ultCharge = 0;
  player.initTalents();

  initDestructibles();
  gameState = 'PLAYING';
}

loadSave();
requestAnimationFrame(gameLoop);
</script>
