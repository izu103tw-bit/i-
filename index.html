<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>竹隱墨寶：百鬼夜行錄 - 功夫熊貓浪人傳</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@600;900&display=swap');
  * { box-sizing: border-box; user-select: none; -webkit-user-select: none; margin: 0; padding: 0; }
  body, html {
    width: 100%; height: 100%; overflow: hidden;
    background-color: #EDE8DF; font-family: 'Noto Serif TC', serif;
  }
  #game-container {
    position: relative; width: 100vw; height: 100vh; overflow: hidden;
    background: radial-gradient(circle at center, #FAF7F2 0%, #EDE5D8 100%);
  }
  canvas { display: block; width: 100%; height: 100%; }

  /* 頂部 HUD */
  #top-hud {
    position: absolute; top: 12px; left: 0; width: 100%;
    display: flex; flex-direction: column; align-items: center;
    pointer-events: none; z-index: 10;
  }
  .exp-bar-wrap {
    width: 86%; max-width: 640px; height: 12px;
    background: rgba(43,42,41,0.12); border: 2px solid #2B2A29;
    border-radius: 8px; overflow: hidden; box-shadow: 0 3px 8px rgba(0,0,0,0.1);
  }
  .exp-bar-fill {
    width: 0%; height: 100%;
    background: linear-gradient(90deg, #00C2FF, #00F2FF);
    transition: width 0.15s ease-out;
  }
  .hud-stats {
    display: flex; gap: 24px; margin-top: 8px; font-weight: 900;
    font-size: 14px; color: #2B2A29; text-shadow: 0 1px 2px rgba(255,255,255,0.8);
  }
  .hud-stats span { display: inline-flex; align-items: center; gap: 4px; }

  /* 左下 HP 奧義 */
  #player-hud {
    position: absolute; bottom: 20px; left: 20px;
    display: flex; flex-direction: column; gap: 6px;
    pointer-events: none; z-index: 10;
  }
  .gauge-box {
    display: flex; align-items: center; gap: 8px;
    background: rgba(250,247,242,0.85); padding: 4px 10px;
    border: 1.5px solid #2B2A29; border-radius: 6px;
    box-shadow: 2px 2px 0 rgba(43,42,41,0.3); font-size: 13px; font-weight: 900;
  }
  .bar-bg { width: 150px; height: 10px; background: rgba(0,0,0,0.15); border-radius: 5px; overflow: hidden; }
  .hp-fill { width: 100%; height: 100%; background: #FF2A4D; transition: width 0.1s; }
  .ult-fill { width: 0%; height: 100%; background: linear-gradient(90deg, #FFB300, #FF1744); }

  /* 觸控控制 */
  #touch-controls {
    position: absolute; width: 100%; height: 100%;
    top: 0; left: 0; pointer-events: none; z-index: 20; display: none;
  }
  #joystick-zone {
    position: absolute; bottom: 30px; left: 30px; width: 130px; height: 130px;
    pointer-events: auto;
  }
  .joy-base {
    position: absolute; width: 100%; height: 100%; border-radius: 50%;
    background: rgba(43,42,41,0.06); border: 2px dashed rgba(43,42,41,0.4);
  }
  .joy-stick {
    position: absolute; width: 50px; height: 50px; border-radius: 50%;
    top: 40px; left: 40px; background: #2B2A29; box-shadow: 0 4px 10px rgba(0,0,0,0.3);
  }
  .action-buttons {
    position: absolute; bottom: 35px; right: 25px;
    display: flex; gap: 14px; pointer-events: auto;
  }
  .act-btn {
    width: 62px; height: 62px; border-radius: 50%; border: 2px solid #2B2A29;
    background: #FAF7F2; color: #2B2A29; font-weight: 900; font-size: 14px;
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    box-shadow: 2px 4px 0 #2B2A29; cursor: pointer; transition: transform 0.08s;
  }
  .act-btn:active { transform: translate(2px, 4px); box-shadow: none; }
  .act-btn span { font-size: 10px; color: #888; }
  .btn-parry { border-color: #00A86B; color: #00A86B; }
  .btn-ult { border-color: #C93B2B; color: #C93B2B; }

  /* 彈窗共通 */
  .modal-overlay {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    background: rgba(30, 28, 26, 0.7); backdrop-filter: blur(4px);
    display: none; justify-content: center; align-items: center;
    z-index: 100;
  }
  .washi-board {
    background: #FAF7F2; border: 3px solid #2B2A29; border-radius: 12px;
    padding: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.4), inset 0 0 40px rgba(215,204,185,0.4);
    position: relative; max-width: 90vw;
  }
  .board-title {
    text-align: center; font-size: 26px; font-weight: 900; color: #2B2A29;
    margin-bottom: 20px; letter-spacing: 2px;
  }
  .board-title::after {
    content: ''; display: block; width: 60px; height: 3px; background: #C93B2B;
    margin: 6px auto 0;
  }

  /* 升級選單 */
  .cards-row { display: flex; gap: 16px; flex-wrap: wrap; justify-content: center; }
  .upgrade-card {
    width: 220px; background: #FFFDF9; border: 2px solid #2B2A29; border-radius: 8px;
    padding: 12px; cursor: pointer; display: flex; flex-direction: column; align-items: center;
    box-shadow: 3px 5px 0 rgba(43,42,41,0.25); transition: all 0.15s ease; position: relative;
  }
  .upgrade-card:hover {
    transform: translateY(-6px); box-shadow: 4px 10px 0 #C93B2B; border-color: #C93B2B;
  }
  .card-preview-canvas {
    width: 190px; height: 100px; border: 1.5px solid rgba(43,42,41,0.3);
    border-radius: 4px; background: #F4EFE6; margin-bottom: 8px;
  }
  .card-name { font-size: 16px; font-weight: 900; color: #2B2A29; margin-bottom: 4px; }
  .card-type { font-size: 11px; padding: 2px 6px; border-radius: 3px; margin-bottom: 6px; font-weight: bold; }
  .type-weapon { background: #00F2FF22; color: #008CA3; border: 1px solid #00F2FF88; }
  .type-passive { background: #C93B2B22; color: #C93B2B; border: 1px solid #C93B2B88; }
  .card-desc { font-size: 12px; color: #555; text-align: center; line-height: 1.4; min-height: 36px; }

  /* 主菜單介面 */
  #main-menu {
    position: absolute; top: 0; left: 0; width: 100%; height: 100%;
    display: flex; flex-direction: column; justify-content: center; align-items: center;
    background: radial-gradient(circle at center, rgba(250,247,242,0.95) 0%, rgba(230,222,210,0.95) 100%);
    z-index: 90;
  }
  .game-logo {
    font-size: 52px; font-weight: 900; color: #2B2A29; letter-spacing: 4px;
    text-shadow: 3px 3px 0 #EDE5D8, 5px 5px 0 #C93B2B; margin-bottom: 8px; text-align: center;
  }
  .game-sub { font-size: 16px; color: #665; letter-spacing: 6px; margin-bottom: 24px; font-weight: bold; }
  .menu-btn-group { display: flex; flex-direction: column; gap: 12px; width: 220px; }
  .menu-btn {
    padding: 12px 0; background: #FAF7F2; border: 2px solid #2B2A29; border-radius: 8px;
    font-size: 16px; font-weight: 900; color: #2B2A29; cursor: pointer;
    box-shadow: 3px 4px 0 #2B2A29; transition: all 0.1s; text-align: center;
  }
  .menu-btn:hover { background: #C93B2B; color: #FAF7F2; border-color: #2B2A29; }
  .menu-btn:active { transform: translate(2px, 3px); box-shadow: none; }
  .currency-pill {
    position: absolute; top: 20px; right: 24px; display: flex; align-items: center; gap: 8px;
    background: #FAF7F2; border: 2px solid #2B2A29; padding: 6px 14px; border-radius: 20px;
    font-weight: 900; color: #2B2A29; box-shadow: 2px 2px 0 rgba(0,0,0,0.2);
  }

  /* 養成 / 成就介面 */
  .upgrades-grid, .achieve-list {
    display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px;
    max-height: 60vh; overflow-y: auto; padding: 8px; width: 560px; max-width: 85vw;
  }
  .achieve-list { grid-template-columns: 1fr; }
  .up-item, .achieve-item {
    background: #FFF; border: 1.5px solid #2B2A29; border-radius: 6px;
    padding: 10px; display: flex; justify-content: space-between; align-items: center;
    box-shadow: 2px 2px 0 rgba(0,0,0,0.1);
  }
  .up-info h4 { font-size: 15px; color: #2B2A29; }
  .up-info p { font-size: 11px; color: #777; margin-top: 2px; }
  .up-btn {
    padding: 6px 12px; background: #00A86B; border: 1.5px solid #2B2A29; border-radius: 4px;
    color: #FFF; font-weight: 900; font-size: 12px; cursor: pointer; box-shadow: 1px 2px 0 #2B2A29;
  }
  .up-btn.disabled { background: #CCC; color: #888; cursor: not-allowed; box-shadow: none; }
  .close-board-btn {
    margin-top: 18px; width: 100%; padding: 10px 0; background: #2B2A29; color: #FAF7F2;
    border: none; border-radius: 6px; font-size: 14px; font-weight: 900; cursor: pointer;
  }
  .achieve-status { font-size: 12px; font-weight: 900; }
  .ach-done { color: #00A86B; }
  .ach-locked { color: #888; }

  /* 結算介面 */
  #game-over-modal .washi-board { text-align: center; min-width: 300px; }
  .over-stat { margin: 8px 0; font-size: 15px; color: #444; }
  .gold-earned { font-size: 20px; color: #C93B2B; font-weight: 900; margin: 12px 0; }
</style>
</head>
<body>
<div id="game-container">
  <canvas id="gameCanvas"></canvas>

  <!-- 頂部 HUD -->
  <div id="top-hud">
    <div class="exp-bar-wrap"><div id="expFill" class="exp-bar-fill"></div></div>
    <div class="hud-stats">
      <span>等級: <strong id="hudLevel" style="color:#C93B2B;">1</strong></span>
      <span>時間: <strong id="hudTime">00:00</strong></span>
      <span>討伐: <strong id="hudKills">0</strong></span>
      <span>金判: <strong id="hudGold" style="color:#D48806;">0</strong></span>
    </div>
  </div>

  <!-- 玩家狀態 -->
  <div id="player-hud">
    <div class="gauge-box">
      <span>體力</span>
      <div class="bar-bg"><div id="hpFill" class="hp-fill"></div></div>
      <span id="hpTxt" style="font-size:10px;">250/250</span>
    </div>
    <div class="gauge-box">
      <span>奧義</span>
      <div class="bar-bg"><div id="ultFill" class="ult-fill"></div></div>
      <span id="ultTxt" style
